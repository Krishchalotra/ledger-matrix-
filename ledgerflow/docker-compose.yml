version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: ledgerflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerflow
      POSTGRES_PASSWORD: ledgerflow_secret
      POSTGRES_DB: ledgerflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ledgerflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ledgerflow_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ledgerflow:ledgerflow_secret@db:5432/ledgerflow_db
      JWT_SECRET: super_secret_ledgerflow_jwt_key_change_in_prod
      JWT_EXPIRES_IN: 7d
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ledgerflow_net

  frontend:
    build: ./frontend
    container_name: ledgerflow_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ledgerflow_net

volumes:
  postgres_data:

networks:
  ledgerflow_net:
    driver: bridge
